name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Build linux/arm64
      env:
        GOOS: linux
        GOARCH: arm64
        CGO_ENABLED: "0"
      run: go build -o /dev/null .

    - name: Test
      run: go test -v ./...

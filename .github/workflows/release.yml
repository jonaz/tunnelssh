# Publishes the tunnelssh agent binary consumed by nergy-se/controllerimage.
# The Yocto image installs this prebuilt static binary and verifies the
# .sha256 instead of compiling tunnelssh itself.

name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Test
      run: go test ./...

    # arm64 for the agent image, amd64 for running the master on a
    # regular server. Each binary gets its own .sha256, with the name the
    # arm64 one always had.
    - name: Build
      env:
        CGO_ENABLED: "0"
      run: |
        for arch in arm64 amd64; do
          GOOS=linux GOARCH=$arch go build -trimpath \
            -ldflags "-X main.Version=${GITHUB_REF_NAME} -X main.BuildCommit=${GITHUB_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o tunnelssh-linux-$arch .
          sha256sum tunnelssh-linux-$arch > tunnelssh-linux-$arch.sha256
          cat tunnelssh-linux-$arch.sha256
        done

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          tunnelssh-linux-arm64 tunnelssh-linux-arm64.sha256 \
          tunnelssh-linux-amd64 tunnelssh-linux-amd64.sha256 \
          --title "$GITHUB_REF_NAME" \
          --notes "tunnelssh built from ${GITHUB_SHA}. sha256: $(cat tunnelssh-linux-arm64.sha256 tunnelssh-linux-amd64.sha256)"

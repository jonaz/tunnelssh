# Publishes the tunnelssh agent binary consumed by nergy-se/controllerimage.
# The Yocto image installs this prebuilt static binary and verifies the
# .sha256 instead of compiling tunnelssh itself.

name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Test
      run: go test ./...

    - name: Build tunnelssh-linux-arm64
      env:
        GOOS: linux
        GOARCH: arm64
        CGO_ENABLED: "0"
      run: |
        go build -trimpath \
          -ldflags "-X main.Version=${GITHUB_REF_NAME} -X main.BuildCommit=${GITHUB_SHA} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o tunnelssh-linux-arm64 .
        sha256sum tunnelssh-linux-arm64 > tunnelssh-linux-arm64.sha256
        cat tunnelssh-linux-arm64.sha256

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          tunnelssh-linux-arm64 tunnelssh-linux-arm64.sha256 \
          --title "$GITHUB_REF_NAME" \
          --notes "tunnelssh built from ${GITHUB_SHA}. sha256: $(cut -d' ' -f1 tunnelssh-linux-arm64.sha256)"
